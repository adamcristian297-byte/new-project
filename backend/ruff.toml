# Ruff — fast lint + format (spec section 2.1)
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length left to formatter

[lint.per-file-ignores]
"tests/*" = ["B011", "SIM115"]

[format]
quote-style = "double"
indent-style = "space"
