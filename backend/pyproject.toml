[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "cachetools>=7.2.1",
    "cryptography>=50.0.2",
    "fastapi>=0.142.3",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.4",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
